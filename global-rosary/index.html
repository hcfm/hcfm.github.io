------------------------------------------------------------------ */
const EXCLUDE_TESTS = true;

/* The moment this dashboard went live: the first commit that deployed it, from
   `git log --diff-filter=A -- global-rosary/index.html` in the hcfm.github.io repo.
   2026-07-31 17:37:50 -0400.

   This date is the whole design. Before it, the form was being exercised by staff and
   developers and nothing was ever cleared out, so those rows are noise. From it onward,
   every submission is a real person who found the page and signed up.

   So the blocklist below applies ONLY to rows created before this moment. A row that
   arrives after it is counted, always, no matter what. The list cannot reach forward in
   time and quietly delete somebody.

   That is deliberately fail-open: if a genuine test is submitted from now on it will be
   counted until a human adds it to POST_LAUNCH_TESTS. That is the right way round for a
   public page. Under-counting a real parish is invisible and permanent; over-counting by

const LIVE_SINCE = Date.parse("2026-07-31T21:37:50Z");

/* Pre-launch noise. Identified 30 Jul by email address (mailinator throwaways,

  return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}

/* Northern Ireland arrives either as the words or as a BT postcode */
function isNorthernIreland(place){
  const p = String(place||"");
  return /northern ireland/i.test(p) || /\bBT\d{1,2}\s*\d[A-Z]{2}\b/i.test(p);
}

/* A trailing token is only a country if it resolves. "MI 49684", "ON N0G 2J0"
   and bare US state codes must never become rows on a public scoreboard. */
function tokenToIso(tok){
  const n = norm(tok);
  if(!n) return null;
  if(/\d/.test(n)) return null;          /* any digit means postcode, not country */
  return ALIAS[n] || null;
}

function countryOf(r){
  /* 1. the field, once the developer populates it */
  const cc = String(r.country_code||"").trim().toUpperCase();
  if(cc && ISO[cc]){
    if(cc === "GB" && isNorthernIreland(r.place_formatted)) return NORTHERN_IRELAND_AS;
    return ISO[cc];
  }
  /* 2. the address text, walking back from the tail until something resolves */
  const parts = String(r.place_formatted||"").split(",");
  for(let i = parts.length - 1; i >= 0 && i >= parts.length - 3; i--){
    const iso = tokenToIso(parts[i]);
    if(iso){
      if(iso === "GB" && isNorthernIreland(r.place_formatted)) return NORTHERN_IRELAND_AS;
      return ISO[iso];
    }
  }
  /* 3. honest about what it does not know */
  return "Unknown";
}
function esc(s){ return s.replace(/[<>&]/g, m => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[m])); }

function animate(el, from, to){
  if(from === null){ el.textContent = fmt(to); return; }
  if(from === to) return;
  const steps=30; let i=0;
  (function tick(){ i++;
    el.textContent = fmt(Math.round(from + (to-from)*(1-Math.pow(1-i/steps,3))));
    if(i<steps) requestAnimationFrame(tick);
    else{ el.textContent=fmt(to); el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"),1100);} })();
}

function render(rows){
  if(EXCLUDE_TESTS) rows = rows.filter(r => !isTest(r));

  const people = rows.reduce((a,r) => a + peopleIn(r), 0);
  animate($("committed"), last.committed, people); last.committed = people;
  const left = Math.max(0, GOAL - people);
  animate($("remaining"), last.remaining, left);   last.remaining = left;

  $("regline").textContent = `across ${fmt(rows.length)} registration${rows.length===1?"":"s"}`;
  const pct = people/GOAL*100;
  $("pct").textContent = pct < 1 ? "of our 250,000 goal" : pct.toFixed(1)+"% of the way there";

  const by = {};
  rows.forEach(r => { const c = countryOf(r); (by[c] = by[c] || {people:0, count:0});
                      by[c].people += peopleIn(r); by[c].count++; });
  /* Unknown sits at the bottom whatever its size — it is a data gap, not a country */
  const list = Object.entries(by).sort((a,b) =>
        (a[0]==="Unknown") - (b[0]==="Unknown")
        || b[1].people - a[1].people
        || a[0].localeCompare(b[0]));

  $("s-reg").textContent  = fmt(rows.length);
  $("s-cty").textContent  = fmt(list.length);
  const wk = Date.now() - 7*864e5;
  $("s-week").textContent = fmt(rows.filter(r => new Date(r.created_at) > wk).length);
  $("s-homes").textContent= fmt(rows.filter(r => r.is_family_rosary_home === true
                                              || r.pin_type === "family_rosary_home").length);

  const max = list.length ? list[0][1].people : 1;
  $("grid").innerHTML = list.map(([c,v],i) => `
    <div class="row">
      <div class="rk">${i+1}</div>
      <div class="cty">${esc(c)}
        <div class="bar"><i style="width:${Math.max(2, v.people/max*100)}%"></i></div>
      </div>
      <div class="num">${fmt(v.people)}<small>${v.count} registration${v.count===1?"":"s"}</small></div>
    </div>`).join("");
  $("empty").style.display = list.length ? "none" : "block";
}

/* PostgREST returns at most 1000 rows per request. Page through with the
   Range header so the total stays correct all the way to 250,000. */
async function fetchAll(){
  const url = `${SUPABASE_URL}/rest/v1/public_registrations`
            + `?select=id,group_count,place_formatted,country_code,pin_type,is_family_rosary_home,created_at`
            + `&order=created_at.desc`;
  const auth = {apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY};
  let from = 0, all = [];
  for(;;){
    const r = await fetch(url, {headers:{...auth,
      "Range-Unit":"items", Range:`${from}-${from+PAGE-1}`}});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const batch = await r.json();
    all = all.concat(batch);
    if(batch.length < PAGE || all.length > 400000) break;
    from += PAGE;
  }
  return all;
}

async function load(){
  if(!SUPABASE_KEY){
    $("dot").classList.add("stale");
    $("updated").textContent = "No key found — add rosary-config.js beside this file";
    return;
  }
  try{
    render(await fetchAll());
    $("dot").classList.remove("stale");
    $("updated").textContent = "Live · updated " +
      new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  }catch(e){
    $("dot").classList.add("stale");
    $("updated").textContent = "Reconnecting — showing last known figures";
  }
}
load();
setInterval(() => { if(!document.hidden) load(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
</script>
